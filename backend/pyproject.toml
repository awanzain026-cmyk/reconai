[project]
name = "reconai-backend"
version = "0.1.0"
description = "ReconAI reconciliation API backend"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]==0.141.1",
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.3.4",
    "bcrypt==5.0.0",
    "pyjwt==2.13.0",
    "python-multipart==0.0.32",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.setuptools]
py-modules = ["auth", "db", "importer", "main", "matcher", "models"]
